<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingest Events — StrawberryPay</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <h1>Ingest Event</h1>
      <span class="endpoint-tag post">POST /events</span>
    </div>
    <div class="content">
      <div class="card">
        <h2>Submit a Payment Event</h2>
        <p class="desc">Send a payment lifecycle event. Idempotent — re-submitting the same event_id will not create duplicates.</p>

        <form id="event-form">
          <div class="form-grid">
            <div class="form-group">
              <label for="event_id">Event ID</label>
              <input type="text" id="event_id" placeholder="e.g. evt_abc123" required>
            </div>
            <div class="form-group">
              <label for="event_type">Event Type</label>
              <select id="event_type" required>
                <option value="payment_initiated">payment_initiated</option>
                <option value="payment_processed">payment_processed</option>
                <option value="settled">settled</option>
                <option value="payment_failed">payment_failed</option>
              </select>
            </div>
            <div class="form-group">
              <label for="transaction_id">Transaction ID</label>
              <input type="text" id="transaction_id" placeholder="e.g. txn_xyz789" required>
            </div>
            <div class="form-group">
              <label for="merchant_id">Merchant ID</label>
              <input type="text" id="merchant_id" placeholder="e.g. merchant_001" required>
            </div>
            <div class="form-group">
              <label for="merchant_name">Merchant Name</label>
              <input type="text" id="merchant_name" placeholder="e.g. Chai Point" required>
            </div>
            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" step="0.01" placeholder="e.g. 1500.00" required>
            </div>
            <div class="form-group">
              <label for="currency">Currency</label>
              <input type="text" id="currency" value="INR" required>
            </div>
            <div class="form-group">
              <label for="timestamp">Timestamp</label>
              <input type="datetime-local" id="timestamp" required>
            </div>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn btn-pink" id="submit-btn">Send Event</button>
            <button type="button" class="btn btn-outline" id="fill-sample">Fill Sample</button>
          </div>
        </form>
      </div>

      <div class="response-box" id="response-box">
        <div class="response-header">
          <span>Response</span>
          <span class="status-code" id="res-status"></span>
        </div>
        <pre class="response-body" id="res-body"></pre>
      </div>
    </div>
  </div>

  <script src="/static/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initNav('events');

      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('timestamp').value = now.toISOString().slice(0, 16);

      document.getElementById('fill-sample').addEventListener('click', () => {
        document.getElementById('event_id').value = 'evt_' + Math.random().toString(36).slice(2, 10);
        document.getElementById('transaction_id').value = 'txn_' + Math.random().toString(36).slice(2, 10);
        document.getElementById('merchant_id').value = 'merchant_001';
        document.getElementById('merchant_name').value = 'Chai Point';
        document.getElementById('amount').value = (Math.random() * 5000 + 100).toFixed(2);
        document.getElementById('currency').value = 'INR';
        document.getElementById('event_type').value = 'payment_initiated';
      });

      document.getElementById('event-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Sending…';

        const payload = {
          event_id: document.getElementById('event_id').value,
          event_type: document.getElementById('event_type').value,
          transaction_id: document.getElementById('transaction_id').value,
          merchant_id: document.getElementById('merchant_id').value,
          merchant_name: document.getElementById('merchant_name').value,
          amount: parseFloat(document.getElementById('amount').value),
          currency: document.getElementById('currency').value,
          timestamp: new Date(document.getElementById('timestamp').value).toISOString()
        };

        const resBox = document.getElementById('response-box');
        const resStatus = document.getElementById('res-status');
        const resBody = document.getElementById('res-body');

        try {
          const res = await fetch(API + '/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          resStatus.textContent = res.status;
          resStatus.className = 'status-code ' + (res.ok ? 'ok' : 'error');
          resBody.textContent = JSON.stringify(data, null, 2);
          resBox.classList.add('show');
        } catch (err) {
          resStatus.textContent = 'Error';
          resStatus.className = 'status-code error';
          resBody.textContent = err.message;
          resBox.classList.add('show');
        }

        btn.disabled = false;
        btn.textContent = 'Send Event';
      });
    });
  </script>
</body>
</html>
